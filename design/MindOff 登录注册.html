<!DOCTYPE html>
<!--
  MindOff · 登录 / 注册 原型
  ────────────────────────────────────────────────────────────
  设计方向（从产品长出来，非凭空）：
    · MindOff 是温柔的桌宠情绪陪伴 app —— 睡前思绪整理、说件放不下的事、桌宠来信。
    · 基调关键词：温柔、不催促、不评判。所以 auth 页不该像冷冰冰的表单，
      而像"回到一个有人等你的地方"。
  视觉 DNA：
    · 暖纸底色（非纯白），单一杏色 accent 贯穿（不用紫渐变）。
    · 衬线 wordmark（Newsreader / Noto Serif SC），body 用系统字。反粗硬字体。
    · lucide 线性图标（不用 emoji）。微文案中文且温柔，用「」引号。
    · 桌宠 = 抽象暖光"陪伴球"占位 —— 正式桌宠形象由设计接入，此处不假画人脸（反 slop）。
  交付形态：iOS 平铺原型，三台可交互 —— 登录 / 注册 / 登录后的陪伴首页一瞥。
    每台可打字、切换密码可见、登录⇄注册互跳、提交后进入欢迎态。
  假设（待你确认）：移动端优先；仅用户名+密码；无验证码（demo）。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MindOff · 登录 / 注册 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<style>
  :root {
    --paper: #F6EEE2;      /* 暖纸底 */
    --paper-2: #FBF5EC;    /* 更浅暖白，卡片外围 */
    --card: #FFFDFA;       /* 卡片 */
    --ink: #453D36;        /* 主文字 */
    --ink-soft: #7C7268;   /* 次要文字 */
    --ink-faint: #A99E92;  /* placeholder / 极弱 */
    --accent: #D68A5C;     /* 杏 · 单一 accent */
    --accent-deep: #C0764A;/* 按压态 */
    --accent-wash: #F6E4D3;/* 极浅杏，focus / 分隔 */
    --line: #EDE3D5;       /* 分隔线 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 700px at 15% -10%, #FCF6EC 0%, rgba(252,246,236,0) 60%),
      radial-gradient(1000px 600px at 100% 110%, #F3E6D6 0%, rgba(243,230,214,0) 55%),
      var(--paper);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: "Newsreader", "Noto Serif SC", Georgia, serif; }
  .cjk-serif { font-family: "Noto Serif SC", "Newsreader", serif; }

  /* 一次性、编排好的载入动画（反 slop：不散落微交互） */
  @keyframes riseIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes softIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }

  input.mo-input {
    font-family: inherit; font-size: 16px; color: var(--ink);
    border: none; outline: none; background: transparent; width: 100%;
    letter-spacing: .01em;
  }
  input.mo-input::placeholder { color: var(--ink-faint); }
  ::selection { background: var(--accent-wash); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ── IosFrame（huashu-design assets/ios_frame.jsx，标准 iPhone 15 Pro 外壳）─── */
const iosFrameStyles = {
  wrapper: { display: 'inline-block', padding: 12, background: '#000', borderRadius: 60, boxShadow: '0 0 0 2px #2a2320, 0 24px 64px rgba(90,60,40,0.22)', position: 'relative' },
  screen: { position: 'relative', borderRadius: 48, overflow: 'hidden', background: '#fff' },
  statusBar: { position: 'absolute', top: 0, left: 0, right: 0, height: 54, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 32px', fontSize: 16, fontWeight: 600, fontFamily: '-apple-system, "SF Pro Text", sans-serif', zIndex: 20, pointerEvents: 'none' },
  dynamicIsland: { position: 'absolute', top: 12, left: '50%', transform: 'translateX(-50%)', width: 124, height: 36, background: '#000', borderRadius: 999, zIndex: 30 },
  statusIcons: { display: 'flex', alignItems: 'center', gap: 6 },
  signalIcon: { display: 'flex', alignItems: 'flex-end', gap: 2, height: 12 },
  signalBar: { width: 3, background: 'currentColor', borderRadius: 1 },
  batteryIcon: { width: 26, height: 12, border: '1.5px solid currentColor', borderRadius: 3, padding: 1, position: 'relative', opacity: 0.8 },
  batteryCap: { position: 'absolute', top: 3, right: -3, width: 2, height: 6, background: 'currentColor', borderRadius: '0 1px 1px 0' },
  content: { position: 'absolute', top: 54, left: 0, right: 0, bottom: 34, overflow: 'auto' },
  homeIndicator: { position: 'absolute', bottom: 10, left: '50%', transform: 'translateX(-50%)', width: 140, height: 5, background: 'rgba(0,0,0,0.28)', borderRadius: 999, zIndex: 10 },
};
function IosFrame({ children, width = 393, height = 852, time = '9:41', battery = 100 }) {
  const textColor = '#000';
  return (
    <div style={iosFrameStyles.wrapper}>
      <div style={{ ...iosFrameStyles.screen, width, height }}>
        <div style={{ ...iosFrameStyles.statusBar, color: textColor }}>
          <span>{time}</span>
          <div style={iosFrameStyles.statusIcons}>
            <div style={iosFrameStyles.signalIcon}>
              <div style={{ ...iosFrameStyles.signalBar, height: 4 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 6 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 9 }} />
              <div style={{ ...iosFrameStyles.signalBar, height: 11 }} />
            </div>
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{ color: textColor }}>
              <path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
              <path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" />
              <path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity="0.7" />
            </svg>
            <div style={iosFrameStyles.batteryIcon}>
              <div style={{ width: `${battery}%`, height: '100%', background: 'currentColor', borderRadius: 1, opacity: 0.9 }} />
              <div style={iosFrameStyles.batteryCap} />
            </div>
          </div>
        </div>
        <div style={iosFrameStyles.dynamicIsland} />
        <div style={iosFrameStyles.content}>{children}</div>
        <div style={iosFrameStyles.homeIndicator} />
      </div>
    </div>
  );
}

/* ── lucide 线性图标（内联；stroke 1.75 圆头）─────────────────────────── */
const ICONS = {
  user: ['M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2', 'M12 7 m -4 0 a 4 4 0 1 0 8 0 a 4 4 0 1 0 -8 0'],
  lock: ['M7 11V7a5 5 0 0 1 10 0v4', 'M5 11 h14 a2 2 0 0 1 2 2 v6 a2 2 0 0 1 -2 2 H5 a2 2 0 0 1 -2 -2 v-6 a2 2 0 0 1 2 -2 z'],
  eye: ['M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z', 'M12 12 m -3 0 a 3 3 0 1 0 6 0 a 3 3 0 1 0 -6 0'],
  eyeOff: ['M9.88 9.88a3 3 0 1 0 4.24 4.24', 'M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68', 'M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61', 'M2 2 20 20'],
  arrow: ['M5 12h14', 'm12 5 7 7-7 7'],
  moon: ['M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z'],
};
function Icon({ name, size = 20, color = 'currentColor', strokeWidth = 1.75, style }) {
  const d = ICONS[name] || [];
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" style={style}>
      {d.map((p, i) => <path key={i} d={p} />)}
    </svg>
  );
}

/* ── 陪伴球（抽象暖光占位；正式桌宠形象由设计接入，不假画人脸）──────── */
function Companion({ size = 88, floating = true }) {
  return (
    <div style={{ position: 'relative', width: size, height: size, animation: floating ? 'floaty 5.5s ease-in-out infinite' : 'none' }}>
      <div style={{
        position: 'absolute', inset: 0, borderRadius: '50%',
        background: 'radial-gradient(circle at 34% 30%, #FCE7CC 0%, #F3BE93 46%, #E29A67 100%)',
        boxShadow: '0 14px 34px rgba(214,138,92,.34), inset -6px -8px 16px rgba(193,118,74,.28), inset 5px 6px 14px rgba(255,255,255,.65)',
      }} />
      <div style={{
        position: 'absolute', top: size * 0.2, left: size * 0.24, width: size * 0.22, height: size * 0.16,
        borderRadius: '50%', background: 'rgba(255,255,255,.7)', filter: 'blur(2px)',
      }} />
      <svg width={size * 0.34} height={size * 0.34} viewBox="0 0 24 24"
        style={{ position: 'absolute', top: -size * 0.06, right: -size * 0.02, color: '#E4A96F', animation: 'twinkle 3.2s ease-in-out infinite' }}>
        <path d="M12 2.5l1.7 6.1 6.1 1.7-6.1 1.7L12 18l-1.7-6L4.2 10.3l6.1-1.7z" fill="currentColor" />
      </svg>
    </div>
  );
}

/* ── 输入行 ───────────────────────────────────────────────────────────── */
function Field({ icon, label, value, onChange, placeholder, type = 'text', trailing, focused, onFocus, onBlur }) {
  return (
    <label style={{ display: 'block' }}>
      <div style={{ fontSize: 13, color: 'var(--ink-soft)', marginBottom: 8, letterSpacing: '.02em' }}>{label}</div>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 12,
        background: focused ? 'var(--card)' : 'rgba(255,253,250,.6)',
        border: `1.5px solid ${focused ? 'var(--accent)' : 'var(--line)'}`,
        boxShadow: focused ? '0 0 0 4px var(--accent-wash)' : 'none',
        borderRadius: 16, padding: '14px 16px', transition: 'all .22s ease',
      }}>
        <Icon name={icon} size={19} color={focused ? 'var(--accent)' : 'var(--ink-faint)'} />
        <input
          className="mo-input" type={type} value={value} placeholder={placeholder}
          onChange={e => onChange(e.target.value)} onFocus={onFocus} onBlur={onBlur}
          autoComplete="off" spellCheck={false}
        />
        {trailing}
      </div>
    </label>
  );
}

/* ── 主按钮 ───────────────────────────────────────────────────────────── */
function PrimaryButton({ children, onClick }) {
  const [press, setPress] = useState(false);
  return (
    <button
      onClick={onClick}
      onMouseDown={() => setPress(true)} onMouseUp={() => setPress(false)} onMouseLeave={() => setPress(false)}
      style={{
        width: '100%', border: 'none', cursor: 'pointer',
        background: press ? 'var(--accent-deep)' : 'var(--accent)',
        color: '#FFF9F3', fontFamily: 'inherit', fontSize: 16, fontWeight: 500, letterSpacing: '.04em',
        padding: '16px', borderRadius: 16,
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
        boxShadow: press ? '0 2px 8px rgba(192,118,74,.3)' : '0 10px 24px rgba(214,138,92,.32)',
        transform: press ? 'translateY(1px)' : 'none', transition: 'all .16s ease',
      }}>
      {children}
      <Icon name="arrow" size={18} color="#FFF9F3" strokeWidth={2} />
    </button>
  );
}

/* ── 登录 / 注册 卡片 ─────────────────────────────────────────────────── */
function AuthCard({ mode, onSwitch, onSubmit }) {
  const isLogin = mode === 'login';
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [hint, setHint] = useState('');
  const [focus, setFocus] = useState(null);

  useEffect(() => { setUsername(''); setPassword(''); setHint(''); setShowPw(false); }, [mode]);

  const submit = () => {
    if (!username.trim()) { setHint('先告诉我你的名字吧'); return; }
    if (!password.trim()) { setHint('还差一句只有你知道的悄悄话'); return; }
    setHint('');
    onSubmit();
  };

  return (
    <div style={{ padding: '28px 26px 26px', display: 'flex', flexDirection: 'column', height: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 30 }}>
        <Companion size={64} />
        <div>
          <div className="serif" style={{ fontSize: 25, fontWeight: 500, letterSpacing: '.01em', lineHeight: 1 }}>MindOff</div>
          <div style={{ fontSize: 12.5, color: 'var(--ink-faint)', marginTop: 6, letterSpacing: '.06em' }}>陪你把心里的事，轻轻放下</div>
        </div>
      </div>

      <div className="cjk-serif" style={{ fontSize: 27, fontWeight: 500, color: 'var(--ink)', lineHeight: 1.2 }}>
        {isLogin ? '欢迎回来' : '第一次见面'}
      </div>
      <div style={{ fontSize: 14, color: 'var(--ink-soft)', marginTop: 10, lineHeight: 1.6 }}>
        {isLogin ? '它一直在这儿，等你回来说说话。' : '给自己起个名字，我们慢慢认识。'}
      </div>

      <div style={{ marginTop: 26, display: 'flex', flexDirection: 'column', gap: 16 }}>
        <Field
          icon="user" label="用户名" value={username} onChange={setUsername}
          placeholder={isLogin ? '你的名字' : '想让我怎么称呼你'}
          focused={focus === 'u'} onFocus={() => { setFocus('u'); setHint(''); }} onBlur={() => setFocus(null)}
        />
        <Field
          icon="lock" label="密码" value={password} onChange={setPassword}
          placeholder="悄悄话，只有你知道" type={showPw ? 'text' : 'password'}
          focused={focus === 'p'} onFocus={() => { setFocus('p'); setHint(''); }} onBlur={() => setFocus(null)}
          trailing={
            <button onClick={() => setShowPw(s => !s)}
              style={{ border: 'none', background: 'transparent', cursor: 'pointer', padding: 2, display: 'flex' }}
              aria-label={showPw ? '隐藏密码' : '显示密码'}>
              <Icon name={showPw ? 'eyeOff' : 'eye'} size={19} color="var(--ink-faint)" />
            </button>
          }
        />
      </div>

      <div style={{ minHeight: 20, marginTop: 12, fontSize: 13, color: 'var(--accent-deep)', opacity: hint ? 1 : 0, transition: 'opacity .2s', letterSpacing: '.02em' }}>
        {hint || '　'}
      </div>

      <div style={{ flex: 1 }} />

      <PrimaryButton onClick={submit}>{isLogin ? '进来坐坐' : '开始吧'}</PrimaryButton>

      <div style={{ textAlign: 'center', marginTop: 18, fontSize: 13.5, color: 'var(--ink-soft)' }}>
        {isLogin ? '还没有账号？' : '已经有账号了？'}
        <span onClick={onSwitch} style={{ color: 'var(--accent-deep)', cursor: 'pointer', marginLeft: 6, fontWeight: 500 }}>
          {isLogin ? '创建一个' : '回来登录'}
        </span>
      </div>
      {!isLogin && (
        <div style={{ textAlign: 'center', marginTop: 12, fontSize: 11.5, color: 'var(--ink-faint)', lineHeight: 1.6 }}>
          demo 版只需用户名与密码，无需验证码
        </div>
      )}
    </div>
  );
}

/* ── 登录后：陪伴首页一瞥（auth 的去向）───────────────────────────────── */
function WelcomeView({ fromRegister, onExit }) {
  return (
    <div style={{
      padding: '30px 26px', height: '100%', display: 'flex', flexDirection: 'column',
      alignItems: 'center', textAlign: 'center', animation: 'softIn .5s ease both',
      background: 'radial-gradient(140% 70% at 50% 0%, #FCEBD6 0%, rgba(252,235,214,0) 55%)',
    }}>
      <div style={{ marginTop: 24 }}><Companion size={120} /></div>
      <div className="cjk-serif" style={{ fontSize: 26, fontWeight: 500, marginTop: 30 }}>
        {fromRegister ? '很高兴认识你' : '你回来啦'}
      </div>
      <div style={{ fontSize: 14, color: 'var(--ink-soft)', marginTop: 12, lineHeight: 1.7, maxWidth: 250, whiteSpace: 'pre-line' }}>
        {fromRegister ? '往后的夜里，我都在。\n今晚，想先跟我说点什么吗？' : '今晚过得还好吗？\n有什么放不下的，都可以慢慢讲。'}
      </div>

      <div style={{ flex: 1 }} />

      <div style={{ width: '100%', display: 'flex', flexDirection: 'column', gap: 12 }}>
        <PrimaryButton onClick={onExit}>进入睡前整理</PrimaryButton>
        <button onClick={onExit}
          style={{ border: 'none', background: 'transparent', color: 'var(--ink-faint)', fontSize: 13, cursor: 'pointer', fontFamily: 'inherit', padding: 6 }}>
          先四处看看
        </button>
      </div>
      <div style={{ fontSize: 11, color: 'var(--ink-faint)', marginTop: 14, display: 'flex', alignItems: 'center', gap: 6 }}>
        <Icon name="moon" size={13} color="var(--ink-faint)" /> 桌宠形象为占位 · 正式版由设计接入
      </div>
    </div>
  );
}

/* ── 单台 iPhone 状态机 ───────────────────────────────────────────────── */
function AppPhone({ initial }) {
  const [screen, setScreen] = useState(initial); // 'login' | 'register' | 'welcome'
  const [cameFrom, setCameFrom] = useState(initial);
  const bg = 'linear-gradient(180deg, var(--paper-2) 0%, var(--paper) 100%)';
  return (
    <IosFrame time="22:47" battery={72}>
      <div style={{ height: '100%', background: bg }}>
        {screen === 'welcome'
          ? <WelcomeView fromRegister={cameFrom === 'register'} onExit={() => setScreen('login')} />
          : <AuthCard
              mode={screen}
              onSwitch={() => setScreen(screen === 'login' ? 'register' : 'login')}
              onSubmit={() => { setCameFrom(screen); setScreen('welcome'); }}
            />}
      </div>
    </IosFrame>
  );
}

/* ── 页面 ─────────────────────────────────────────────────────────────── */
const PHONES = [
  { initial: 'login', label: '登录 · 回到有人等你的地方' },
  { initial: 'register', label: '注册 · 第一次见面' },
  { initial: 'welcome', label: '登录后 · 陪伴首页一瞥' },
];

function Page() {
  return (
    <div style={{ padding: '56px 40px 80px' }}>
      <div style={{ maxWidth: 760, margin: '0 auto 12px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, color: 'var(--accent-deep)', fontSize: 13, letterSpacing: '.14em', textTransform: 'uppercase' }}>
          <Icon name="moon" size={15} color="var(--accent-deep)" /> MindOff Prototype
        </div>
        <h1 className="serif" style={{ fontSize: 40, fontWeight: 500, margin: '14px 0 0', letterSpacing: '.005em' }}>
          登录 / 注册
        </h1>
        <p style={{ fontSize: 15, color: 'var(--ink-soft)', lineHeight: 1.75, maxWidth: 560, marginTop: 14 }}>
          不是一道冷冰冰的门禁，而是「回到一个有人等你的地方」。暖纸底、单一杏色、衬线字与温柔微文案，
          延续桌宠陪伴的基调。三台均可交互：打字、切换密码可见、登录⇄注册互跳、提交后进入欢迎态。
        </p>
      </div>

      <div style={{ display: 'flex', gap: 40, flexWrap: 'wrap', justifyContent: 'center', alignItems: 'flex-start', marginTop: 44 }}>
        {PHONES.map((p, i) => (
          <div key={p.initial} style={{ animation: `riseIn .7s cubic-bezier(.2,.7,.2,1) both`, animationDelay: `${i * 0.12}s` }}>
            <div style={{ fontSize: 13, color: 'var(--ink-soft)', fontStyle: 'italic', marginBottom: 12, textAlign: 'center', maxWidth: 393 }}>
              {p.label}
            </div>
            <AppPhone initial={p.initial} />
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
</html>
