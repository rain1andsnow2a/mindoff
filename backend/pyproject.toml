[project]
name = "mindoff-backend"
version = "0.1.0"
description = "MindOff AI 网关 — 阶跃星辰模型接入基础层（文本/语音转文字/实时通话）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13.0",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
]

[tool.uv]
package = false
