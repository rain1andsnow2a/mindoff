# MindOff 后端线上编排。服务器上的布局：
#   /opt/mindoff/docker-compose.yml   ← 本文件
#   /opt/mindoff/backend/             ← 后端源码（deploy/deploy.py 同步上传）
#   /opt/mindoff/.env                 ← 线上密钥（不入库，deploy.py 生成）
#
# 起停：cd /opt/mindoff && docker compose up -d --build / docker compose down
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: mindoff-backend:latest
    container_name: mindoff-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # SQLite 落在命名卷里，容器重建不丢
      DATABASE_URL: sqlite:////data/mindoff.db
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - mindoff-data:/data
      - mindoff-static:/app/static
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mindoff-data:
  mindoff-static:
