<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>喵灵 · 思绪中枢方案 · 用户说 ↔ 喵灵来</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#FCFAF7; --surface:#FFFDFA; --surface-el:#FFFFFF;
  --ink:#403A35; --ink2:#756C63; --muted:#9D9389;
  --border:#E8E2D8; --accent:#B8860B; --acc-surf:#F6E7A8;
  --acc-soft:rgba(246,225,143,0.48); --success:#5E7D68; --error:#A8483D;
  --divider:#E8E2D8; --r-card:18px; --r-pill:999px;
  --shadow-soft:0 4px 12px rgba(64,58,53,0.08);
  --shadow-float:0 12px 28px rgba(64,58,53,0.14);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#DAD4CB;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;padding:44px 30px 80px}
.head{max-width:1240px}
.head h1{font-size:23px;font-weight:600;letter-spacing:-.4px;color:#332E29}
.head .lede{margin-top:10px;font-size:14px;line-height:1.75;color:#5F5852;max-width:860px}
.head .lede b{font-weight:600;color:#413B35}

/* ── 双向信息流 ── */
.flow{margin-top:30px;max-width:1240px;display:grid;grid-template-columns:1fr 130px 1fr;gap:18px;align-items:stretch}
.flow .side{background:rgba(255,253,248,.7);border:1px solid rgba(64,58,53,.08);border-radius:20px;padding:18px 20px}
.flow .side h3{font-size:13px;font-weight:600;letter-spacing:.3px;margin-bottom:4px}
.flow .side .st{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.flow .pipe{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.flow .pipe .arr{font-size:15px;color:var(--accent);font-weight:600}
.flow .pipe .lab{font-size:10.5px;color:var(--muted);letter-spacing:.2px}
.flow .row3{display:flex;gap:8px;margin-top:4px}
.flow .chip3{flex:1;border-radius:12px;padding:10px;border:1px solid rgba(255,255,255,.5);background:#fff}
.flow .chip3 .i{font-size:17px}
.flow .chip3 .t{font-size:11.5px;font-weight:600;margin-top:4px}
.flow .chip3 .d{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.5}

/* ── 手机 ── */
.grid{display:flex;flex-wrap:wrap;gap:44px 30px;margin-top:40px;align-items:flex-start}
.col{width:392px}
.cap{margin-bottom:14px;min-height:92px}
.cap .tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.3px;color:#7A5C08;background:var(--acc-soft);padding:3px 10px;border-radius:var(--r-pill)}
.cap h3{font-size:16px;font-weight:600;margin:10px 0 5px;color:#332E29}
.cap p{font-size:12.5px;line-height:1.7;color:#6E675F}
.cap p em{font-style:normal;color:#8A6A12}
.phone{width:392px;padding:10px;background:#1A1A1A;border-radius:44px;box-shadow:0 0 0 2px #2A2A2A,0 22px 52px rgba(60,50,40,.3)}
.screen{position:relative;width:100%;height:800px;border-radius:36px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.sbar{flex:none;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600;color:#8B827A}
.punch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:#000;z-index:30}
.navbar{flex:none;height:26px;display:flex;align-items:center;justify-content:center}
.navbar i{width:104px;height:4px;border-radius:var(--r-pill);background:rgba(64,58,53,.28)}
.tabbar{flex:none;height:58px;border-top:1px solid var(--divider);display:flex;align-items:stretch;background:rgba(255,253,248,.94)}
.tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px}
.tabbar .tb.on{color:var(--accent)}
.scroll{overflow-y:auto;scrollbar-width:thin;flex:1}
.scroll::-webkit-scrollbar{width:3px}
.scroll::-webkit-scrollbar-thumb{background:rgba(64,58,53,.16);border-radius:2px}
.btn{border:none;border-radius:999px;padding:11px 0;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.btn.gold{background:var(--acc-surf);color:#4B3B16}
.btn.soft{background:rgba(255,252,245,.7);color:var(--ink2);border:1px solid rgba(255,255,255,.45)}
.card3{border-radius:18px;padding:14px;border:1px solid rgba(255,255,255,.5);background:#fff;margin-bottom:10px}
.envelope{width:100%;border-radius:22px;padding:18px 20px;background:rgba(252,247,225,.96);border:1px solid rgba(255,255,255,.6);position:relative;overflow:hidden}
.paper{width:100%;border-radius:22px;padding:20px;background:rgba(255,253,247,.96);border:1px solid rgba(255,255,255,.6)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

/* lucide 风格描边图标（不用 emoji）：每个图标一组 path */
const ICONS = {
  mic: ["M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z","M19 10v2a7 7 0 0 1-14 0v-2","M12 19v4"],
  mail: ["M22 7l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7","M2 4h20v16H2z"],
  leaf: ["M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z","M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"],
  film: ["M2 3h20v18H2z","M7 3v18","M17 3v18","M2 8h5","M2 12h20","M2 16h5","M17 16h5"],
  user: ["M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2","M12 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"],
  bulb: ["M9 18h6","M10 22h4","M15.09 14c.18-1 .57-1.7 1.21-2.5A7 7 0 1 0 7.7 4.5C4.2 8.6 7.5 14 15.09 14Z"],
  check: ["M22 11.08V12a10 10 0 1 1-5.93-9.14","m9 11 3 3L22 4"],
  bell: ["M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9","M10.3 21a1.94 1.94 0 0 0 3.4 0"],
  archive: ["M2 3h20v5H2z","M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8","M10 12h4"],
  spark: ["M12 3v3","M12 18v3","M3 12h3","M18 12h3","M5.6 5.6l2 2","M16.4 16.4l2 2","M18.4 5.6l-2 2","M7.6 16.4l-2 2"],
};
function Ic({n, size=18, color="currentColor", sw=1.8}){
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{ICONS[n].map((d,i)=><path key={i} d={d}/>)}</svg>;
}

const PET = "米露";

function Phone({children}){
  return (
    <div className="phone"><div className="screen">
      <div className="punch" /><div className="sbar"><span>20:56</span><span>5G · 100%</span></div>
      {children}
      <div className="tabbar">
        <div className="tb on"><Ic n="leaf" size={17} /><span>陪伴</span></div>
        <div className="tb"><Ic n="mail" size={17} /><span>信箱</span></div>
        <div className="tb"><Ic n="film" size={17} /><span>片场</span></div>
        <div className="tb"><Ic n="user" size={17} /><span>我的</span></div>
      </div>
      <div className="navbar"><i /></div>
    </div></div>
  );
}

/* 屏 1 · 对喵灵说：统一入口 */
function SayScreen(){
  const [rec, setRec] = useState(false);
  const [said, setSaid] = useState(false);
  return (
    <>
      <div style={{flex:"none",padding:"16px 20px 4px",textAlign:"center"}}>
        <div style={{fontSize:19,fontWeight:600,letterSpacing:-.3}}>对喵灵说</div>
        <div style={{fontSize:12,color:"var(--muted)",marginTop:4}}>想到什么都可以说，整理是它的事</div>
      </div>
      <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:18,padding:"0 24px"}}>
        <div style={{width:150,height:150,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div style={{position:"absolute",width:150,height:150,borderRadius:75,background:"var(--acc-soft)"}} />
          <button onClick={()=>{setRec(!rec);setSaid(!said)}} style={{width:92,height:92,borderRadius:46,border:"1.5px solid rgba(255,255,255,.55)",background:rec?"var(--acc-surf)":"var(--surface-el)",cursor:"pointer",boxShadow:"var(--shadow-float)",display:"flex",alignItems:"center",justifyContent:"center"}}><Ic n="mic" size={34} color={rec?"#4B3B16":"var(--accent)"} /></button>
        </div>
        <div style={{fontSize:13,color:"var(--ink2)"}}>{said ? "喵灵正在听…" : "点一下，开始说"}</div>
      </div>
      <div style={{flex:"none",display:"flex",gap:8,padding:"0 20px 18px"}}>
        {[["bulb","想法","整理变清晰"],["film","过去的","变成 3D 场景"],["check","未来的","成为待办"]].map(([n,t,d])=>(
          <div key={t} style={{flex:1,borderRadius:14,padding:10,textAlign:"center",background:"rgba(255,253,248,.9)",border:"1px solid rgba(255,255,255,.5)"}}>
            <div style={{display:"flex",justifyContent:"center"}}><Ic n={n} size={16} color="var(--accent)" /></div>
            <div style={{fontSize:11,fontWeight:600,marginTop:3}}>{t}</div>
            <div style={{fontSize:10,color:"var(--muted)",marginTop:2}}>{d}</div>
          </div>
        ))}
      </div>
    </>
  );
}

/* 屏 2 · 我的思绪：统一视图（想法/场景/待办 三块） */
function ThoughtScreen(){
  const [tab, setTab] = useState("all");
  const segs = [["all","全部"],["idea","想法"],["scene","场景"],["todo","待办"]];
  const items = [
    {k:"idea", n:"bulb", t:"夏末天台的那句再见", d:"整理：把没说出口的话，试着在重演里说出来", tag:"灵感"},
    {k:"todo", n:"check", t:"周三 15:00 和妈妈通电话", d:"你说想跟她说说最近的打算", tag:"待办"},
    {k:"scene", n:"film", t:"校门口的告别", d:"上次说到她打车离开，可以重演一次", tag:"候选场景"},
    {k:"idea", n:"bulb", t:"面馆的招牌汤面", d:"整理：周末想再去一次，记下了", tag:"小结"},
  ];
  const shown = items.filter(x => tab==="all" || x.k===tab);
  return (
    <>
      <div style={{flex:"none",padding:"14px 20px 4px"}}>
        <div style={{fontSize:20,fontWeight:600,letterSpacing:-.3}}>我的思绪</div>
        <div style={{fontSize:12,color:"var(--muted)",marginTop:3}}>你告诉喵灵的，都被整理收在这里</div>
      </div>
      <div style={{flex:"none",display:"flex",gap:6,padding:"12px 20px 6px",flexWrap:"wrap"}}>
        {segs.map(([k,l])=>(
          <button key={k} onClick={()=>setTab(k)} style={{padding:"6px 13px",borderRadius:999,font: "inherit",fontSize:12.5,cursor:"pointer",border:"1px solid "+(tab===k?"#E3CE7E":"rgba(255,255,255,.5)"),background:tab===k?"var(--acc-surf)":"rgba(255,253,248,.9)",fontWeight:tab===k?600:400,color:tab===k?"#6E5A28":"var(--ink2)"}}>{l}</button>
        ))}
      </div>
      <div className="scroll" style={{padding:"10px 20px 6px"}}>
        <div style={{fontSize:12,color:"var(--muted)",marginBottom:8}}>昨夜你说的话 → 分类成 4 条</div>
        {shown.map(x=>(
          <div className="card3" key={x.t}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
              <Ic n={x.n} size={15} color="var(--accent)" />
              <span style={{fontSize:11,fontWeight:600,color:"#8A6A12"}}>{x.tag}</span>
            </div>
            <div style={{fontSize:14,fontWeight:500,color:"#4B443F"}}>{x.t}</div>
            <div style={{fontSize:12,color:"#847D72",marginTop:4,lineHeight:17}}>{x.d}</div>
            <div style={{display:"flex",gap:8,marginTop:10}}>
              {x.k==="todo" && <button className="btn soft" style={{flex:1,padding:"7px 0",fontSize:13}}>做完了</button>}
              {x.k==="scene" && <button className="btn gold" style={{flex:1,padding:"7px 0",fontSize:13}}>进入重演</button>}
              {x.k==="idea" && <button className="btn soft" style={{flex:1,padding:"7px 0",fontSize:13}}>展开看看</button>}
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

/* 屏 3 · 桌宠来信：喵灵主动来 */
function LetterScreen(){
  const [open, setOpen] = useState(false);
  return (
    <>
      <div style={{flex:"none",padding:"14px 20px 4px"}}>
        <div style={{fontSize:20,fontWeight:600,letterSpacing:-.3}}>桌宠来信</div>
        <div style={{fontSize:12,color:"var(--muted)",marginTop:3}}>喵灵主动写给你的 · 不是等你开口</div>
      </div>
      <div className="scroll" style={{padding:"16px 20px 6px"}}>
        {!open ? (
          <div className="envelope" onClick={()=>setOpen(true)}>
            <div style={{display:"flex",justifyContent:"flex-end",marginBottom:12}}><span style={{width:34,height:34,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(246,231,168,.72)"}}><Ic n="leaf" size={16} color="#8A6A12" /></span></div>
            <div style={{fontSize:15,fontWeight:500,marginBottom:4,color:"#4D4249"}}>昨晚你说想再吃那家面馆</div>
            <div style={{fontSize:11.5,color:"#8C8187"}}>今早 8:04 · 喵灵主动</div>
            <div style={{fontSize:12,color:"#A39A9F",marginTop:6}}>我记下了，周三下午的时间还空着……</div>
          </div>
        ) : (
          <div className="paper">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
              <div><div style={{fontSize:11,color:"#8C8187",marginBottom:4}}>今早 8:04 · 喵灵主动</div>
              <div style={{fontSize:17,fontWeight:500,color:"#4D4249"}}>昨晚你说想再吃那家面馆</div></div>
              <span style={{width:34,height:34,borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(246,231,168,.6)"}}><Ic n="leaf" size={16} color="#8A6A12" /></span>
            </div>
            <div style={{fontSize:13.5,lineHeight:22,color:"#62575D"}}>你周末说想去把那家面馆的招牌汤面再吃一次。周三下午的时间还空着，想一起去的话告诉我一声，我帮你把这条也放进待办。</div>
            <div style={{display:"flex",gap:8,marginTop:18}}>
              <button className="btn gold" style={{flex:1}}>收到啦</button>
              <button className="btn soft" style={{flex:1}}>回它一句</button>
            </div>
            <div onClick={()=>setOpen(false)} style={{marginTop:10,fontSize:12,textAlign:"center",color:"var(--accent)",cursor:"pointer"}}>收起来</div>
          </div>
        )}
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:14}}>
          <span style={{fontSize:12,color:"var(--muted)"}}>喵灵还会主动：</span>
          {["提醒待办","场景邀请","睡前回访"].map(x=>(
            <span key={x} style={{fontSize:11,color:"#6E5A28",background:"var(--acc-soft)",borderRadius:999,padding:"3px 10px"}}>{x}</span>
          ))}
        </div>
      </div>
    </>
  );
}

/* 屏 4 · 想法归档：整理变清晰 */
function IdeaScreen(){
  const [fold, setFold] = useState(true);
  return (
    <>
      <div style={{flex:"none",padding:"14px 20px 4px"}}>
        <div style={{fontSize:20,fontWeight:600,letterSpacing:-.3,display:"flex",alignItems:"center",gap:8}}><Ic n="bulb" size={18} color="var(--accent)" /> 一个想法</div>
        <div style={{fontSize:12,color:"var(--muted)",marginTop:3}}>零碎的话，被整理成清楚的样子</div>
      </div>
      <div className="scroll" style={{padding:"16px 20px 6px"}}>
        <div className="paper">
          <div style={{fontSize:11,color:"#8C8187",marginBottom:6}}>你说 · 昨晚 23:14</div>
          <div style={{fontSize:15,lineHeight:24,color:"#62575D",fontStyle:"italic"}}>「那天在天台上，我们站了很久，谁都没开口。后来她转学了，我一直想那句话要是说出口就好了……还有那家面馆，下次一定要再去。」</div>
        </div>
        <div style={{textAlign:"center",fontSize:12,color:"var(--accent)",margin:"14px 0 10px"}}>▼ 喵灵整理成</div>
        <div className="card3">
          <div style={{display:"flex",gap:8}}>
            <Ic n="bulb" size={15} color="var(--accent)" style={{flex:"none",marginTop:2}} /><div><div style={{fontSize:13.5,fontWeight:600,color:"#4B443F"}}>没说完的那句话，可以试着在重演里说完</div>
            <div style={{fontSize:12,color:"#847D72",marginTop:4,lineHeight:17}}>已归类为「想重演的过去」→ 可生成 3D 场景</div></div>
          </div>
        </div>
        <div className="card3">
          <div style={{display:"flex",gap:8}}>
            <Ic n="check" size={15} color="#5E7D68" style={{flex:"none",marginTop:2}} /><div><div style={{fontSize:13.5,fontWeight:600,color:"#4B443F"}}>周末再去一次那家面馆</div>
            <div style={{fontSize:12,color:"#847D72",marginTop:4,lineHeight:17}}>已归为「待办」→ 会提醒你</div></div>
          </div>
        </div>
        <button onClick={()=>setFold(!fold)} className="btn soft" style={{width:"100%",marginTop:4}}>{fold ? "这条不要，撤销归档" : "已撤销"}</button>
      </div>
    </>
  );
}

const SCREENS = [
  { id:1, Comp:SayScreen, tag:"统一入口", title:"对喵灵说", desc:"随时随地说话或打字，不限于睡前。它先接住，再判断该去哪。" },
  { id:2, Comp:ThoughtScreen, tag:"统一视图", title:"我的思绪", desc:"所有整理结果集中一处，按 <em>想法 / 场景 / 待办</em> 分组回看。" },
  { id:3, Comp:LetterScreen, tag:"喵灵主动", title:"桌宠来信", desc:"它不只等你开口——会主动来信：提醒、场景邀请、睡前回访。" },
  { id:4, Comp:IdeaScreen, tag:"归档变清晰", title:"整理后的样子", desc:"一句零碎的话，被拆成「想重演的过去」+「待办」，各归其位。" },
];

function App(){
  return (
    <>
      <div className="head">
        <h1>喵灵 · 思绪中枢</h1>
        <p className="lede">
          一句话：<b>你只管对喵灵说</b>，它自动分清这是「想法 / 想重演的过去 / 未来的事」，
          各归其位；同时喵灵<b>也会主动来信</b>——提醒、场景邀请、睡前回访，不让你一直等。
          下面对应已有后端能力：自动分类（待办/灵感/情绪/片段）、场景重演、来信系统全部已实现，
          本方案是给它们一个统一的「归处」与入口。
        </p>
      </div>

      {/* 双向信息流 */}
      <div className="flow">
        <div className="side">
          <h3>← 你 → 喵灵</h3>
          <div className="st">随时说话 / 打字，不分睡前</div>
          <div className="row3">
            <div className="chip3"><div className="i"><Ic n="bulb" size={15} color="var(--accent)" /></div><div className="t">想法 / 零碎</div><div className="d">整理归档<br/>变清晰</div></div>
            <div className="chip3"><div className="i"><Ic n="film" size={15} color="var(--accent)" /></div><div className="t">过去 / 想经历</div><div className="d">生成 3D 场景<br/>重演一次</div></div>
            <div className="chip3"><div className="i"><Ic n="check" size={15} color="#5E7D68" /></div><div className="t">未来的事</div><div className="d">整理成待办<br/>到时提醒</div></div>
          </div>
        </div>
        <div className="pipe">
          <div className="arr">◆</div>
          <div className="lab">喵灵<br/>自动分流</div>
          <div className="arr">◆</div>
        </div>
        <div className="side">
          <h3>喵灵 → 你（主动）</h3>
          <div className="st">不只等你开口，也会主动来</div>
          <div className="row3">
            <div className="chip3"><div className="i"><Ic n="mail" size={15} color="var(--accent)" /></div><div className="t">来信</div><div className="d">问候 / 音乐<br/>关系回访</div></div>
            <div className="chip3"><div className="i"><Ic n="bell" size={15} color="var(--accent)" /></div><div className="t">提醒</div><div className="d">待办到期<br/>次日接回</div></div>
            <div className="chip3"><div className="i"><Ic n="film" size={15} color="var(--accent)" /></div><div className="t">场景邀请</div><div className="d">候选片段<br/>确认后重演</div></div>
          </div>
        </div>
      </div>

      <div className="grid">
        {SCREENS.map(s => (
          <div className="col" key={s.id}>
            <div className="cap"><span className="tag">{s.tag}</span><h3>{s.title}</h3><p dangerouslySetInnerHTML={{__html:s.desc}} /></div>
            <Phone><s.Comp /></Phone>
          </div>
        ))}
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
