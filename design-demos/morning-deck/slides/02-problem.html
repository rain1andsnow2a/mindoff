<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P02 · 为什么做</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .stage{ position:absolute; inset:88px 0 0; padding:64px 96px 56px; display:flex; flex-direction:column; }
  .quote{ position:relative; margin-top:auto; padding-left:150px; }
  .quote .mark{
    position:absolute; left:0; top:-58px; font-size:220px; line-height:1; font-weight:700;
    color:var(--acc-surf); font-family:Georgia,serif;
  }
  .quote .h1{ font-size:88px; max-width:1300px; }
  .lede{ margin-top:36px; max-width:1080px; padding-left:150px; }
  .pains{ margin-top:auto; display:flex; gap:28px; }
  .pain{ flex:1; padding:26px 30px 26px 34px; }
  .pain h3{ font-size:22px; font-weight:600; margin-bottom:8px; }
  .pain p{ font-size:17px; line-height:1.7; color:var(--ink2); }
</style>
</head>
<body>
  <div class="masthead">
    <div class="brand"><img src="../assets/logo.jpg" alt="喵灵">喵灵 Morning<span class="sep">·</span><span class="sub">产品介绍</span></div>
    <div class="meta">ADVENTUREX 2026</div>
  </div>

  <div class="stage">
    <div class="kicker">为什么做 WHY</div>
    <div class="quote">
      <div class="mark">「</div>
      <h1 class="h1">一到夜里，<br>脑子就<span class="em">停不下来</span>。</h1>
    </div>
    <p class="lede">越到睡前，思绪越吵：明天的事在预演，过去的事在重播。它们不缺一个效率工具，缺的是一个<b>可以放心托付的地方</b>。</p>

    <div class="pains">
      <div class="card moodbar pain">
        <h3>转个不停的待办</h3>
        <p>明天的安排一遍遍在脑子里过，怕忘，又怕想太多睡不着。</p>
      </div>
      <div class="card moodbar green pain">
        <h3>重播的那句话</h3>
        <p>白天没说出口、没说好的话，夜里反复上演，没有出口。</p>
      </div>
      <div class="card moodbar pain">
        <h3>一闪而过的灵感</h3>
        <p>好点子总在快睡着时冒出来，记，怕清醒；不记，怕丢。</p>
      </div>
    </div>
  </div>
</body>
</html>
