<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P04 · 功能 · 陪伴</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .stage{ position:absolute; inset:88px 0 0; padding:56px 96px 48px; }
  .h1{ margin-top:26px; }
  .lede{ margin-top:22px; max-width:900px; }
  .body{ display:flex; gap:72px; margin-top:48px; align-items:flex-start; }

  .phones{ display:flex; gap:34px; }
  .ph{ text-align:center; }
  .ph .frame{
    width:262px; height:566px; border-radius:44px; background:#111; padding:9px;
    box-shadow:0 24px 56px rgba(60,45,20,0.20);
  }
  .ph .frame img{ width:100%; height:100%; border-radius:36px; object-fit:cover; object-position:top center; display:block; }
  .ph .cap{ margin-top:14px; font-size:15px; color:var(--ink2); }

  .points{ flex:1; display:flex; flex-direction:column; gap:22px; padding-top:6px; }
  .point{ padding:24px 28px 24px 32px; }
  .point h3{ font-size:23px; font-weight:600; margin-bottom:8px; }
  .point p{ font-size:18px; line-height:1.7; color:var(--ink2); }
</style>
</head>
<body>
  <div class="masthead">
    <div class="brand"><img src="../assets/logo.jpg" alt="喵灵">喵灵 Morning<span class="sep">·</span><span class="sub">产品介绍</span></div>
    <div class="meta">ADVENTUREX 2026</div>
  </div>

  <div class="stage">
    <div class="kicker">功能 01 · 陪伴 COMPANION</div>
    <h1 class="h1">它记得你。</h1>
    <p class="lede">首页没有功能墙，只有一只在等你的桌宠。你们聊过的天都收在「往日」里——下次打开，<b>接着上次的话头继续</b>。</p>

    <div class="body">
      <div class="phones">
        <div class="ph"><div class="frame"><img src="../assets/shot-home.png" alt="陪伴首页"></div><div class="cap">首页 · 气泡接着上次聊</div></div>
        <div class="ph"><div class="frame"><img src="../assets/shot-journal.png" alt="往日手帐"></div><div class="cap">往日 · 按日期回顾</div></div>
        <div class="ph"><div class="frame"><img src="../assets/shot-chat.png" alt="继续聊天"></div><div class="cap">回到那天的聊天</div></div>
      </div>

      <div class="points">
        <div class="card moodbar point">
          <h3>四种聊天模式</h3>
          <p>自由聊聊、一股脑倒出来、说件放不下的事、回看一个片段——想什么方式说，都可以。</p>
        </div>
        <div class="card moodbar green point">
          <h3>文字与实时语音</h3>
          <p>打字、语音输入、实时通话三种通道；不想说话的夜晚，它也会安静陪着。</p>
        </div>
        <div class="card moodbar point">
          <h3>往日手帐</h3>
          <p>每段对话按日期收进手帐，点开就能回到那天的上下文，不用重新解释近况。</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
