<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P01 · 封面</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .stage{ position:absolute; inset:88px 0 0; display:flex; align-items:center; padding:0 96px; gap:60px; }
  .left{ flex:1.25; }
  .left .kicker{ margin-bottom:44px; }
  .left .h1{ font-size:96px; }
  .left .lede{ margin-top:40px; max-width:760px; }
  .foot{ margin-top:72px; display:flex; align-items:center; gap:18px; font-size:17px; color:var(--ink3); letter-spacing:.12em; }
  .foot .line{ width:56px; height:1px; background:var(--border); }
  .right{ flex:1; position:relative; height:100%; }
  .logo{
    position:absolute; right:150px; top:90px; width:400px; height:400px;
    border-radius:96px; box-shadow:0 40px 90px rgba(64,58,53,0.28);
  }
  .glow{
    position:absolute; right:70px; top:40px; width:560px; height:560px; border-radius:50%;
    background:radial-gradient(circle, rgba(240,212,119,0.35), transparent 65%);
  }
  .cat{ position:absolute; right:90px; bottom:30px; height:400px; }
</style>
</head>
<body>
  <div class="masthead">
    <div class="brand"><img src="../assets/logo.jpg" alt="喵灵">喵灵 Morning<span class="sep">·</span><span class="sub">产品介绍</span></div>
    <div class="meta">ADVENTUREX 2026</div>
  </div>

  <div class="stage">
    <div class="left">
      <div class="kicker">情感陪伴 AGENT · 思绪托管</div>
      <h1 class="h1">把明天的事，<br><span class="em">还给明天。</span></h1>
      <p class="lede">一只住在手机里的黑猫，替你接住睡前停不下来的思绪——<b>倒出来的，它连夜整理好；没闭环的，它陪你重演了结。</b></p>
      <div class="foot"><span class="line"></span>ADVENTUREX 2026 黑客松 · DAYFIRE 团队</div>
    </div>
    <div class="right">
      <div class="glow"></div>
      <img class="logo" src="../assets/logo.jpg" alt="喵灵 App 图标">
      <img class="cat" src="../assets/miro.png" alt="桌宠米露">
    </div>
  </div>
</body>
</html>
