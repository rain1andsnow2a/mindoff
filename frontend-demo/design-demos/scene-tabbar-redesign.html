<!DOCTYPE html>
<!--
  MindOff 片场页 · 底部导航重设计 · 3 方案对比
  ══════════════════════════════════════════════
  Assumptions:
  - 问题根因：现底栏 GlassSurface rgba(255,252,245,0.55)，Android 无 backdrop-blur，
    列表文字直接穿透 → 三案共同前提：底栏必须「完全不透明」。
  - 色彩/圆角/字号全部取自 frontend-demo/src/design-system/tokens.ts（日间模式）。
  - 页面内容用真实数据（深夜通话大卡 + 我的场景列表），三案页面主体一致，
    只变底栏与其衔接方式，方便横向对比。
  - 字体：平台系统无衬线（项目规则，不引外部字体）。

  方案 A 实心奶油舱：全宽贴地、实心 surface、顶部发丝线——最安稳、最像系统件。
  方案 B 暖纸浮岛：  保留悬浮胶囊气质，但完全实心 + 底部雾化渐变过渡——现方案的「修正版」。
  方案 C 小剧场幕布：深棕舞台色底栏与深夜通话大卡呼应，金色选中光点——最有「片场」性格。
-->
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>片场底栏 · 3 方案</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background:#EBE6DE; padding:36px 40px 48px;
    display:flex; gap:44px; justify-content:center; align-items:flex-start;
  }
  .variant { display:flex; flex-direction:column; gap:14px; }
  .variant-label { font-size:14px; color:#756C63; font-style:italic; text-align:center; }
  .variant-label b { color:#403A35; font-style:normal; font-size:15px; }

  /* ── 手机壳 ── */
  .phone {
    width:390px; height:844px; background:#FCFAF7; border-radius:38px;
    border:1px solid #D8D2C8; box-shadow:0 24px 60px rgba(64,58,53,.18);
    overflow:hidden; position:relative;
  }
  .statusbar {
    height:44px; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; font-size:13px; font-weight:600; color:#403A35;
  }
  .page { position:absolute; top:44px; bottom:0; left:0; right:0; overflow:hidden; }
  .scroll { padding:8px 20px 0; }

  /* ── 英雄大卡（深夜通话）── */
  .hero {
    border-radius:22px; overflow:hidden; position:relative; height:300px;
    background:radial-gradient(circle at 82% 22%, #4A3A30 0%, #38291F 46%, #241812 100%);
    padding:26px 24px; display:flex; flex-direction:column; justify-content:flex-end;
    box-shadow:0 12px 28px rgba(64,58,53,.14);
  }
  .hero::before {
    content:""; position:absolute; right:-40px; top:-60px; width:220px; height:220px;
    border-radius:50%; background:rgba(210,160,90,.10);
  }
  .hero::after {
    content:""; position:absolute; right:70px; bottom:90px; width:130px; height:130px;
    border-radius:50%; background:rgba(210,160,90,.07);
  }
  .hero .tags { font-size:13px; color:rgba(245,236,216,.62); letter-spacing:.5px; }
  .hero h1 { font-size:30px; color:#F5ECD8; margin:8px 0 6px; font-weight:600; }
  .hero p  { font-size:14px; color:rgba(245,236,216,.78); }
  .hero .enter {
    margin-top:18px; align-self:flex-start; padding:10px 22px; border-radius:999px;
    border:1.5px solid rgba(245,236,216,.34); color:rgba(245,236,216,.92); font-size:14px;
    background:rgba(255,252,245,.08);
  }
  .dots { display:flex; gap:6px; justify-content:center; margin:12px 0 4px; }
  .dot { width:6px; height:6px; border-radius:3px; background:#D9D2C6; }
  .dot.on { width:18px; background:#E0C154; }

  /* ── 我的场景 ── */
  .section-title { font-size:19px; font-weight:600; color:#403A35; margin:18px 2px 12px; }
  .card {
    background:#FFFDFA; border:1px solid #E8E2D8; border-radius:18px;
    padding:16px; margin-bottom:10px; display:flex; align-items:center; gap:8px;
    box-shadow:0 4px 12px rgba(64,58,53,.05);
  }
  .card .txt { flex:1; }
  .card .t { font-size:15px; font-weight:500; color:#403A35; }
  .card .s { font-size:12px; color:#9D9389; margin-top:3px; display:flex; align-items:center; gap:6px; }
  .chip {
    display:inline-block; font-size:11px; color:#8A6D1F; background:rgba(246,231,168,.55);
    border-radius:999px; padding:1px 8px;
  }
  .icon-btn { width:28px; height:28px; display:flex; align-items:center; justify-content:center; color:#B4AA9F; }
  .icon-btn svg { width:15px; height:15px; }

  svg.lucide { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* ═════════ 方案 A · 实心奶油舱 ═════════ */
  .nav-a {
    position:absolute; left:0; right:0; bottom:0; background:#FFFDFA;
    border-top:1px solid #E8E2D8; box-shadow:0 -8px 24px rgba(64,58,53,.07);
    padding:8px 12px 22px; display:flex;
  }
  .nav-a .item {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 0 6px; border-radius:14px; color:#9D9389; font-size:11.5px; font-weight:500;
  }
  .nav-a .item svg { width:21px; height:21px; }
  .nav-a .item.on {
    background:rgba(246,225,143,.48); color:#8A6D1F;
    box-shadow:0 0 16px rgba(232,199,88,.20);
  }
  .nav-a .item.on svg { stroke-width:2.2; }

  /* ═════════ 方案 B · 暖纸浮岛 ═════════ */
  .fade-b {
    position:absolute; left:0; right:0; bottom:0; height:132px; pointer-events:none;
    background:linear-gradient(to top, #FCFAF7 34%, rgba(252,250,247,0) 100%);
  }
  .nav-b {
    position:absolute; left:16px; right:16px; bottom:14px; background:#FFFDFA;
    border:1px solid #E8E2D8; border-radius:999px;
    box-shadow:0 12px 28px rgba(64,58,53,.16), 0 2px 6px rgba(64,58,53,.06);
    padding:7px; display:flex; gap:2px;
  }
  .nav-b .item {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2.5px;
    padding:7px 0 5px; border-radius:999px; color:#9D9389; font-size:11px; font-weight:500;
  }
  .nav-b .item svg { width:20px; height:20px; }
  .nav-b .item.on {
    background:linear-gradient(180deg, #F8ECB4 0%, #F1DE93 100%);
    color:#6E5615; box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 3px 8px rgba(196,149,58,.22);
  }
  .nav-b .item.on svg { stroke-width:2.2; }

  /* ═════════ 方案 C · 小剧场幕布 ═════════ */
  .fade-c {
    position:absolute; left:0; right:0; bottom:0; height:120px; pointer-events:none;
    background:linear-gradient(to top, rgba(56,41,31,.16) 0%, rgba(56,41,31,0) 100%);
  }
  .nav-c {
    position:absolute; left:0; right:0; bottom:0;
    background:linear-gradient(180deg, #3E2F26 0%, #332419 100%);
    border-radius:24px 24px 0 0; padding:12px 12px 24px;
    box-shadow:0 -10px 30px rgba(36,24,18,.28);
  }
  .nav-c::before { /* 胶片齿孔 */
    content:""; position:absolute; top:6px; left:50%; transform:translateX(-50%);
    width:120px; height:3px; border-radius:2px;
    background:repeating-linear-gradient(90deg, rgba(245,236,216,.22) 0 8px, transparent 8px 16px);
  }
  .nav-c .row { display:flex; margin-top:4px; }
  .nav-c .item {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:8px 0 4px; color:rgba(245,236,216,.48); font-size:11.5px; font-weight:500;
    position:relative;
  }
  .nav-c .item svg { width:21px; height:21px; }
  .nav-c .item.on { color:#EFCC66; text-shadow:0 0 14px rgba(232,199,88,.45); }
  .nav-c .item.on svg { stroke-width:2.2; filter:drop-shadow(0 0 6px rgba(232,199,88,.5)); }
  .nav-c .item.on::after {
    content:""; position:absolute; bottom:-3px; width:5px; height:5px; border-radius:3px;
    background:#EFCC66; box-shadow:0 0 8px rgba(239,204,102,.8);
  }
</style>
</head>
<body>

<!-- ═══════════ 方案 A ═══════════ -->
<div class="variant">
  <div class="variant-label"><b>方案 A · 实心奶油舱</b><br>全宽贴地 · 实心奶油面 · 顶部发丝线，最安稳</div>
  <div class="phone">
    <div class="statusbar"><span>19:32</span><span>5G · 68%</span></div>
    <div class="page">
      <div class="scroll" id="pageA"></div>
      <div class="nav-a" id="navA"></div>
    </div>
  </div>
</div>

<!-- ═══════════ 方案 B ═══════════ -->
<div class="variant">
  <div class="variant-label"><b>方案 B · 暖纸浮岛</b><br>悬浮胶囊改实心 + 底部雾化过渡，延续现气质</div>
  <div class="phone">
    <div class="statusbar"><span>19:32</span><span>5G · 68%</span></div>
    <div class="page">
      <div class="scroll" id="pageB"></div>
      <div class="fade-b"></div>
      <div class="nav-b" id="navB"></div>
    </div>
  </div>
</div>

<!-- ═══════════ 方案 C ═══════════ -->
<div class="variant">
  <div class="variant-label"><b>方案 C · 小剧场幕布</b><br>深棕舞台色呼应大卡 · 金色光点选中，最「片场」</div>
  <div class="phone">
    <div class="statusbar"><span>19:32</span><span>5G · 68%</span></div>
    <div class="page">
      <div class="scroll" id="pageC"></div>
      <div class="fade-c"></div>
      <div class="nav-c"><div class="row" id="navC"></div></div>
    </div>
  </div>
</div>

<script>
/* ── 图标（lucide 路径）── */
const IC = {
  chat:'<svg class="lucide" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
  mail:'<svg class="lucide" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>',
  film:'<svg class="lucide" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 7.5h4M3 12h18M3 16.5h4M17 7.5h4M17 16.5h4"/></svg>',
  user:'<svg class="lucide" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  trash:'<svg class="lucide" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  chev:'<svg class="lucide" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
};

/* ── 页面主体（三案共用，隔离变量=底栏）── */
const scenes = ["学校门口叫住朋友","深夜通话","家中餐桌","校门口的停留"];
const page = `
  <div class="hero">
    <div class="tags">恋人 · 朋友 · 异地家人</div>
    <h1>深夜通话</h1>
    <p>有些话，隔着一通电话才说得出口。</p>
    <div class="enter">进入场景</div>
  </div>
  <div class="dots"><div class="dot on"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="section-title">我的场景</div>
  ${scenes.map(t=>`
    <div class="card">
      <div class="txt">
        <div class="t">${t}</div>
        <div class="s"><span class="chip">进行中</span>第 0 轮</div>
      </div>
      <div class="icon-btn">${IC.trash}</div>
      <div class="icon-btn">${IC.chev}</div>
    </div>`).join("")}
`;
document.getElementById("pageA").innerHTML = page;
document.getElementById("pageB").innerHTML = page;
document.getElementById("pageC").innerHTML = page;

/* ── 底栏 ── */
const tabs = [["chat","陪伴"],["mail","信箱"],["film","片场"],["user","我的"]];
const nav = act => tabs.map(([ic,label]) =>
  `<div class="item ${label===act?"on":""}">${IC[ic]}<span>${label}</span></div>`).join("");
document.getElementById("navA").innerHTML = nav("片场");
document.getElementById("navB").innerHTML = nav("片场");
document.getElementById("navC").innerHTML = nav("片场");
</script>
</body>
</html>
